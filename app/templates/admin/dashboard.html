{% extends "base.html" %}

{% block title %}Dashboard Admin{% endblock %}

{% block content %}
<h2 class="mb-4">Dashboard Admin</h2>
<div class="row">
    <div class="col-md-4 mb-3">
        <div class="card text-white bg-primary shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Total Pengguna</h5>
                <p class="card-text display-6">120</p>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card text-white bg-success shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Total Produk</h5>
                <p class="card-text display-6">45</p>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card text-white bg-warning shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Transaksi Baru</h5>
                <p class="card-text display-6">8</p>
            </div>
        </div>
    </div>
</div>

<div class="mt-4">
    <a href="{{ url_for('admin.manage_products') }}" class="btn btn-outline-primary">Kelola Produk</a>
    <a href="{{ url_for('admin.manage_users') }}" class="btn btn-outline-secondary">Kelola Pengguna</a>
</div>
{% endblock %}
