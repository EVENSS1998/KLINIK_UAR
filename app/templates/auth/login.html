{% extends 'base.html' %}
{% block title %}Login - TokoKu{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3"
                    style="width: 60px; height: 60px;">
                    <span class="material-symbols-outlined fs-2">lock</span>
                </div>
                <h3 class="fw-bold">Masuk ke Akun</h3>
                <p class="text-muted small">Masukkan kredensial akun TokoKu Anda</p>
            </div>

            <form method="POST" action="">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><span
                                class="material-symbols-outlined text-muted fs-5">person</span></span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0"
                            placeholder="Masukkan username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><span
                                class="material-symbols-outlined text-muted fs-5">vpn_key</span></span>
                        <input type="password" name="password" class="form-control border-start-0 ps-0"
                            placeholder="Masukkan password" required>
                    </div>
                </div>

                <button type="submit"
                    class="btn btn-primary-custom w-100 py-2 fw-bold d-flex justify-content-center align-items-center gap-2">
                    <span>Login</span> <span class="material-symbols-outlined fs-5">arrow_forward</span>
                </button>
            </form>

            <hr class="my-4 text-muted opacity-25">
            <div class="text-center text-muted small">
                Belum punya akun? <a href="{{ url_for('auth.register') }}"
                    class="text-decoration-none fw-bold text-primary-custom">Daftar Sekarang</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
